# MinIO S3A Configuration for Spark
spark.hadoop.fs.s3a.endpoint            http://minio:9000
spark.hadoop.fs.s3a.access.key           minioadmin
spark.hadoop.fs.s3a.secret.key           minioadmin
spark.hadoop.fs.s3a.path.style.access    true
spark.hadoop.fs.s3a.impl                 org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled  false
spark.hadoop.fs.s3a.attempts.maximum     5
spark.hadoop.fs.s3a.connection.timeout   5000

# Performance tuning
spark.sql.adaptive.enabled               true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.shuffle.partitions             8
spark.dynamicAllocation.enabled          false
spark.executor.memory                    512m
spark.executor.cores                     2

spark.driver.extraClassPath    /opt/spark/external_jars/*
spark.executor.extraClassPath  /opt/spark/external_jars/*

spark.hadoop.fs.s3a.connection.timeout 60000
spark.hadoop.fs.s3a.connection.establish.timeout 60000
spark.hadoop.fs.s3a.retry.interval 1000
spark.hadoop.fs.s3a.threads.keepalivetime 60
spark.hadoop.fs.s3a.multipart.purge.age 86400

# Enable API support.
spark.master.rest.enabled=true